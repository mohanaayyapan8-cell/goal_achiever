<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard:index' %}{% else %}{% url 'dashboard:home' %}{% endif %}">&#127919; Goal Achiever</a>
    <nav class="nav-actions">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'dashboard:index' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'accounts:profile' %}">Profile</a>
        <a class="nav-link bell" href="{% url 'notifications:list' %}" aria-label="Notifications">&#128276;<span id="bell-count" class="bell-count" {% if not unread_notifications %}hidden{% endif %}>{{ unread_notifications }}</span></a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost">Log out</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'accounts:login' %}">Log in</a>
        <a class="btn" href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
      <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Toggle dark or light theme">
        <span id="theme-toggle-label">Dark mode</span>
      </button>
    </nav>
  </div>
</header>
