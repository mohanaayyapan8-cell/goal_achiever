{% extends "base_app.html" %}
{% block title %}Delete {{ kind }} – Goal Achiever{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Delete {{ kind }}?</h2>
  <p>You are about to delete <strong>{{ name }}</strong>.</p>
  <p class="muted">{{ detail }} This cannot be undone.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-ghost" href="{% url cancel_url cancel_arg %}">Cancel</a>
  </form>
</div>
{% endblock %}
