<form method="post" action="{% url 'learning:topic_set_status' topic.pk %}" class="inline-form">
  {% csrf_token %}
  <input type="hidden" name="status" value="{{ status }}">
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn btn-small {% if not primary %}btn-ghost{% endif %}">{{ label }}</button>
</form>
